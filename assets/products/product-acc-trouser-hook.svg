<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F6F3" />
      <stop offset="100%" stop-color="#EBE8E2" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#262222" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#262222" flood-opacity="0.08" />
    </filter>
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#262222" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Studio Surface Backdrop -->
  <rect width="600" height="600" fill="url(#bgGlow)" />
  <circle cx="300" cy="460" r="180" fill="#262222" opacity="0.04" filter="blur(16px)" />

  <!-- Product Illustration -->
  <g class="product-graphic" filter="url(#softShadow)">
    
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#BDC3C7" />
      <stop offset="100%" stop-color="#7F8C8D" />
    </linearGradient>
  </defs>
  <!-- Hook Component -->
  <g transform="translate(180, 200)">
    <rect x="0" y="0" width="100" height="150" rx="10" fill="url(#steelGrad)" stroke="#5E686D" stroke-width="4" />
    <path d="M 30 30 L 70 30 L 70 110 L 45 110 L 45 70 L 30 70 Z" fill="#2C3E50" opacity="0.3" />
    <circle cx="28" cy="125" r="8" fill="#2C3E50" />
    <circle cx="72" cy="125" r="8" fill="#2C3E50" />
  </g>
  <!-- Bar Component (Receiver) -->
  <g transform="translate(325, 200)">
    <rect x="0" y="20" width="95" height="110" rx="8" fill="url(#steelGrad)" stroke="#5E686D" stroke-width="4" />
    <rect x="25" y="45" width="45" height="60" rx="4" fill="#2C3E50" opacity="0.3" />
    <circle cx="25" cy="105" r="6" fill="#2C3E50" />
    <circle cx="70" cy="105" r="6" fill="#2C3E50" />
  </g>

  </g>
</svg>