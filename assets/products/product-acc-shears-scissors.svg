<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F6F3" />
      <stop offset="100%" stop-color="#EBE8E2" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#262222" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#262222" flood-opacity="0.08" />
    </filter>
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#262222" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Studio Surface Backdrop -->
  <rect width="600" height="600" fill="url(#bgGlow)" />
  <circle cx="300" cy="460" r="180" fill="#262222" opacity="0.04" filter="blur(16px)" />

  <!-- Product Illustration -->
  <g class="product-graphic" filter="url(#softShadow)">
    
  <defs>
    <linearGradient id="bladeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
  </defs>
  <g transform="translate(140, 100) rotate(25 200 200)">
    <!-- Top Sharp Blade -->
    <path d="M 120 180 L 360 140 C 370 145, 360 160, 320 170 L 120 195 Z" fill="url(#bladeSteel)" stroke="#4B5563" stroke-width="3" />
    <!-- Bottom Blade -->
    <path d="M 120 190 L 370 240 C 375 230, 360 215, 310 205 L 120 175 Z" fill="url(#bladeSteel)" stroke="#4B5563" stroke-width="3" />
    <!-- Center Pivot Brass Screw -->
    <circle cx="120" cy="185" r="14" fill="#F2D179" stroke="#8F6317" stroke-width="3" />
    <!-- Handle Loops (Black lacquered) -->
    <path d="M 120 185 C 90 170, 40 160, 30 190 C 20 220, 60 240, 110 200 Z" fill="#262222" stroke="#1A1818" stroke-width="4" />
    <path d="M 120 185 C 90 205, 30 210, 20 250 C 10 290, 70 320, 115 220 Z" fill="#262222" stroke="#1A1818" stroke-width="4" />
  </g>

  </g>
</svg>