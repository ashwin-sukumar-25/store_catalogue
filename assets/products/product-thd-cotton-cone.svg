<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F6F3" />
      <stop offset="100%" stop-color="#EBE8E2" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#262222" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#262222" flood-opacity="0.08" />
    </filter>
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#262222" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Studio Surface Backdrop -->
  <rect width="600" height="600" fill="url(#bgGlow)" />
  <circle cx="300" cy="460" r="180" fill="#262222" opacity="0.04" filter="blur(16px)" />

  <!-- Product Illustration -->
  <g class="product-graphic" filter="url(#softShadow)">
    
  <defs>
    <linearGradient id="cottonWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E3DFD5" />
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#D6D1C4" />
    </linearGradient>
  </defs>
  <polygon points="260,110 340,110 365,480 235,480" fill="#C7D92B" stroke="#9EB015" stroke-width="3" />
  <polygon points="255,140 345,140 375,445 225,445" fill="url(#cottonWhite)" stroke="#D4CEC0" stroke-width="2" />
  <!-- Texture -->
  <line x1="240" y1="160" x2="360" y2="164" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="177" x2="360" y2="181" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="194" x2="360" y2="198" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="211" x2="360" y2="215" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="228" x2="360" y2="232" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="245" x2="360" y2="249" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="262" x2="360" y2="266" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="279" x2="360" y2="283" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="296" x2="360" y2="300" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="313" x2="360" y2="317" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="330" x2="360" y2="334" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="347" x2="360" y2="351" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="364" x2="360" y2="368" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="381" x2="360" y2="385" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="398" x2="360" y2="402" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" /><line x1="240" y1="415" x2="360" y2="419" stroke="#B8B2A4" stroke-opacity="0.3" stroke-width="2" />
  <ellipse cx="300" cy="115" rx="38" ry="12" fill="#E6E2D8" stroke="#BAB4A6" stroke-width="3" />
  <circle cx="300" cy="115" r="14" fill="#262222" />
  <!-- Badge Label wrapped on cone -->
  <rect x="250" y="270" width="100" height="40" rx="4" fill="#262222" opacity="0.9" />
  <text x="300" y="294" font-family="sans-serif" font-size="10" font-weight="bold" fill="#C7D92B" text-anchor="middle">100% COTTON</text>

  </g>
</svg>