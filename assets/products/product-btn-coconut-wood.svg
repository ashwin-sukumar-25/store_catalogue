<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F6F3" />
      <stop offset="100%" stop-color="#EBE8E2" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#262222" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#262222" flood-opacity="0.08" />
    </filter>
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#262222" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Studio Surface Backdrop -->
  <rect width="600" height="600" fill="url(#bgGlow)" />
  <circle cx="300" cy="460" r="180" fill="#262222" opacity="0.04" filter="blur(16px)" />

  <!-- Product Illustration -->
  <g class="product-graphic" filter="url(#softShadow)">
    
  <defs>
    <radialGradient id="woodGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8D5B36" />
      <stop offset="60%" stop-color="#5E381C" />
      <stop offset="100%" stop-color="#3B1F0B" />
    </radialGradient>
  </defs>
  <circle cx="300" cy="290" r="130" fill="url(#woodGrad)" stroke="#4A2A14" stroke-width="4" />
  <circle cx="300" cy="290" r="105" fill="#4F2E17" stroke="#2B1608" stroke-width="2" />
  <circle cx="300" cy="290" r="95" fill="url(#woodGrad)" />
  <!-- Grain speckles -->
  <circle cx="250" cy="240" r="2" fill="#241206" />
  <circle cx="330" cy="250" r="3" fill="#241206" />
  <circle cx="270" cy="330" r="2.5" fill="#241206" />
  <circle cx="325" cy="320" r="2" fill="#241206" />
  <circle cx="270" cy="275" r="12" fill="#1C0E05" />
  <circle cx="330" cy="275" r="12" fill="#1C0E05" />
  <circle cx="270" cy="315" r="12" fill="#1C0E05" />
  <circle cx="330" cy="315" r="12" fill="#1C0E05" />
  <line x1="270" y1="275" x2="330" y2="315" stroke="#E6C8A0" stroke-width="4" stroke-linecap="round" />
  <line x1="330" y1="275" x2="270" y2="315" stroke="#E6C8A0" stroke-width="4" stroke-linecap="round" />

  </g>
</svg>