<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F6F3" />
      <stop offset="100%" stop-color="#EBE8E2" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#262222" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#262222" flood-opacity="0.08" />
    </filter>
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#262222" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Studio Surface Backdrop -->
  <rect width="600" height="600" fill="url(#bgGlow)" />
  <circle cx="300" cy="460" r="180" fill="#262222" opacity="0.04" filter="blur(16px)" />

  <!-- Product Illustration -->
  <g class="product-graphic" filter="url(#softShadow)">
    
  <defs>
    <linearGradient id="iridescent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E8F4F8" />
      <stop offset="50%" stop-color="#FFE9F0" />
      <stop offset="75%" stop-color="#E8F9E8" />
      <stop offset="100%" stop-color="#F2EBFF" />
    </linearGradient>
  </defs>
  <circle cx="290" cy="290" r="130" fill="url(#iridescent)" stroke="#D4D9D6" stroke-width="4" />
  <circle cx="290" cy="290" r="105" fill="#FCFCFA" stroke="#D1CEC7" stroke-width="2" />
  <circle cx="290" cy="290" r="92" fill="url(#iridescent)" opacity="0.85" />
  <circle cx="260" cy="265" r="11" fill="#4A4543" />
  <circle cx="320" cy="265" r="11" fill="#4A4543" />
  <circle cx="260" cy="315" r="11" fill="#4A4543" />
  <circle cx="320" cy="315" r="11" fill="#4A4543" />
  <!-- Gloss highlights -->
  <path d="M 220 230 Q 290 190 350 220 Q 340 240 280 225 Z" fill="#FFFFFF" opacity="0.6" />

  </g>
</svg>