<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="buttonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF9549" />
      <stop offset="60%" stop-color="#F07824" />
      <stop offset="100%" stop-color="#D96010" />
    </radialGradient>
    <radialGradient id="innerRim" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </radialGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#262222" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background circular badge container -->
  <rect width="200" height="200" rx="40" fill="#FFFFFF"/>
  <rect x="2" y="2" width="196" height="196" rx="38" fill="none" stroke="#F5F5F5" stroke-width="4"/>

  <!-- Outer Sewing Button in Brand Orange -->
  <g filter="url(#subtleDrop)">
    <circle cx="100" cy="100" r="72" fill="url(#buttonGrad)" />
    <!-- Rim bevel -->
    <circle cx="100" cy="100" r="70" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" />
    <circle cx="100" cy="100" r="54" fill="none" stroke="#A94805" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.45" />
    <circle cx="100" cy="100" r="52" fill="#E86E1B" />
    <circle cx="100" cy="100" r="52" fill="url(#innerRim)" />
    
    <!-- Central Stitched Thread Cross -->
    <line x1="82" y1="82" x2="118" y2="118" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="118" y1="82" x2="82" y2="118" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="82" y1="82" x2="118" y2="118" stroke="#C7D92B" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- 4 Button Holes with Lime and White accents -->
    <!-- Hole Top-Left -->
    <circle cx="82" cy="82" r="9" fill="#262222" />
    <circle cx="82" cy="82" r="7" fill="#1A1818" />
    <circle cx="80" cy="80" r="3" fill="#FFFFFF" opacity="0.3" />

    <!-- Hole Top-Right -->
    <circle cx="118" cy="82" r="9" fill="#262222" />
    <circle cx="118" cy="82" r="7" fill="#1A1818" />
    <circle cx="116" cy="80" r="3" fill="#FFFFFF" opacity="0.3" />

    <!-- Hole Bottom-Left -->
    <circle cx="82" cy="118" r="9" fill="#262222" />
    <circle cx="82" cy="118" r="7" fill="#1A1818" />
    <circle cx="80" cy="116" r="3" fill="#FFFFFF" opacity="0.3" />

    <!-- Hole Bottom-Right -->
    <circle cx="118" cy="118" r="9" fill="#262222" />
    <circle cx="118" cy="118" r="7" fill="#1A1818" />
    <circle cx="116" cy="116" r="3" fill="#FFFFFF" opacity="0.3" />

    <!-- Accent Lime indicator dots -->
    <circle cx="100" cy="38" r="5" fill="#C7D92B" />
    <circle cx="100" cy="162" r="5" fill="#C7D92B" />
    <circle cx="38" cy="100" r="5" fill="#C7D92B" />
    <circle cx="162" cy="100" r="5" fill="#C7D92B" />
  </g>
</svg>
